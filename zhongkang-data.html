<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中康数据 · 补气补血 TOP10 动态榜单</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="zhongkang_data.js"></script>
<style>
:root{
  --primary:#4361ee; --primary-d:#3a0ca3; --accent:#f72585;
  --bg:#f0f2f5; --card:#fff; --text:#1f2430; --muted:#6b7280;
  --line:#e5e8ef; --up:#e5484d; --down:#16a34a; --flat:#9aa3b2;
  --radius:12px; --shadow:0 2px 12px rgba(20,30,60,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden;font-size:14px}
.sidebar{width:200px;background:linear-gradient(180deg,#667eea 0%,#764ba2 100%);color:#fff;
  display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar .logo{padding:0 20px 20px;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:10px}
.sidebar a{display:block;padding:10px 20px;color:rgba(255,255,255,.78);text-decoration:none;font-size:14px}
.sidebar a:hover,.sidebar a.active{color:#fff;background:rgba(255,255,255,.15);font-weight:600}
.sidebar a i{width:20px;margin-right:8px}
.sidebar .back-link{margin-top:auto;border-top:1px solid rgba(255,255,255,.2);padding-top:10px}
.main{margin-left:200px;padding:24px 26px 48px;max-width:1900px}
@media(max-width:900px){.sidebar{width:100%;flex-direction:row;padding:10px;height:auto;position:relative;overflow-x:auto}
  .sidebar .logo{padding:0 10px;margin:0;border:none;border-right:1px solid rgba(255,255,255,.2);font-size:14px}
  .sidebar a{padding:6px 10px;font-size:13px;white-space:nowrap}.main{margin-left:0;padding:14px}}

.page-head{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:.2px}
.page-head h1 i{color:var(--primary);margin-right:8px}
.page-head .meta{font-size:12.5px;color:var(--muted);width:100%}
.badge{background:#eef2ff;color:var(--primary);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.build{font-size:11px;color:#a0aab8;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;align-items:stretch}
@media(max-width:1280px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0;
  border-top:3px solid var(--primary)}
.kpi:nth-child(2){border-top-color:#7209b7}.kpi:nth-child(3){border-top-color:#f72585}.kpi:nth-child(4){border-top-color:#06d6a0}
.kpi .k-t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kpi .k-v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k-v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .k-s{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
.kpi .k-s b{font-variant-numeric:tabular-nums;font-weight:600}
.up{color:var(--up)!important}.down{color:var(--down)!important}.flat{color:var(--flat)!important}

.bar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .lb{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.seg{display:inline-flex;background:#f1f3f8;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#55607a;font-size:12.5px;padding:6px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--primary)}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(20,30,60,.12)}
select.sel{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.bar .spacer{flex:1}
.note-inline{font-size:11.5px;color:var(--muted);width:100%;margin-top:2px}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch;margin-bottom:16px}
@media(max-width:1180px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0;
  display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.card-h h2{font-size:15.5px;font-weight:700}
.card-h h2 i{color:var(--primary);margin-right:6px}
.card-h .sub{font-size:11.5px;color:var(--muted);width:100%;margin:4px 0 8px}
.chart-box{position:relative;width:100%;min-width:0;flex:1 1 auto;height:340px}
.chart-box.tall{height:400px}
.exp-btn{width:20px;height:20px;padding:0;border:0;background:transparent;color:var(--primary);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.exp-btn:hover{color:var(--primary-d)}
.exp-btn svg{display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.table-wrap{overflow-x:auto;overflow-y:hidden;width:100%;min-width:0}
table.dt{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
table.dt th{background:#f7f8fc;color:#55607a;font-weight:600;position:sticky;top:0;z-index:2}
table.dt th:first-child,table.dt td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;
  white-space:normal;min-width:250px;max-width:330px;line-height:1.35;overflow:visible}
table.dt th:first-child{z-index:3;background:#f7f8fc}
table.dt tbody tr:hover td{background:#f7f9ff}
table.dt tbody tr:hover td:first-child{background:#f7f9ff}
table.dt tr.sum-row td{font-weight:700;background:#fafbfe}
table.dt td.rk{color:var(--muted);width:34px;text-align:center!important}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.facts{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px}
.facts h2{font-size:15px;margin-bottom:12px}.facts h2 i{color:var(--primary);margin-right:6px}
.facts ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
@media(max-width:900px){.facts ul{grid-template-columns:1fr}}
.facts li{font-size:12.5px;color:var(--muted);padding-left:16px;position:relative;line-height:1.7}
.facts li:before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.facts li b{color:var(--text);font-weight:600}
.foot{text-align:center;font-size:11.5px;color:var(--muted);padding:14px 0}
.err{background:#fff4f4;color:#b42318;border-radius:10px;padding:20px;margin:20px 0}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo"><i class="fas fa-chart-pie"></i> 数据看板</div>
    <a href="ejiao-dashboard.html"><i class="fas fa-city"></i> 中心城市数据</a>
    <a href="zhongkang-data.html" class="active"><i class="fas fa-chart-bar"></i> 中康数据</a>
    <a href="shipping-data.html"><i class="fas fa-truck"></i> 内部销售数据</a>
    <a href="insurance-dashboard.html"><i class="fas fa-shield-halved"></i> 医保政策</a>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工作看板</a>
</div>
<div class="main">
  <div class="page-head">
    <h1><i class="fas fa-chart-bar"></i>中康数据 · 补气补血 TOP10 动态榜单</h1>
    <span class="badge" id="hdPeriod">—</span>
    <span class="build" id="hdBuild" title="页面构建时间（不是数据截止时间）">—</span>
    <div class="meta" id="hdMeta">—</div>
  </div>

  <div class="kpi-grid" id="kpiRow"></div>

  <div class="bar">
    <span class="lb">细分市场</span>
    <div class="seg" id="groupSeg"></div>
    <span class="lb">时间粒度</span>
    <div class="seg" id="periodSeg">
      <button data-v="q" class="on">季度</button><button data-v="m">月度</button>
    </div>
    <span class="lb">时间范围</span>
    <select class="sel" id="rangeSel">
      <option value="12">近 12 期</option><option value="24">近 24 期</option><option value="all">全部</option>
    </select>
    <span class="lb">份额口径</span>
    <div class="seg" id="denomSeg">
      <button data-v="group" class="on">占本组市场</button><button data-v="market">占补气补血大盘</button>
    </div>
    <span class="spacer"></span>
    <span class="lb">明细指标</span>
    <select class="sel" id="metricSel">
      <option value="sales">销售额（百万元）</option>
      <option value="yoy">同比（%）</option>
      <option value="share">份额·占大盘（%）</option>
      <option value="gshare">份额·占本组（%）</option>
      <option value="chg">份额变化（pp）</option>
    </select>
    <div class="note-inline" id="ctrlNote">—</div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-h">
        <h2><i class="fas fa-ranking-star"></i>最新期 TOP10 榜单</h2>
        <button class="exp-btn" data-exp="rank" title="导出榜单 CSV" aria-label="导出榜单 CSV"></button>
        <div class="sub" id="rankSub">—</div>
      </div>
      <div class="chart-box"><canvas id="rankChart"></canvas></div>
      <div class="legend">
        <span><i style="background:var(--up)"></i>同比增长</span>
        <span><i style="background:var(--down)"></i>同比下滑</span>
        <span><i style="background:var(--flat)"></i>无同比基准</span>
        <span>柱长按销售额，颜色只表示涨跌方向</span>
      </div>
    </div>
    <div class="card">
      <div class="card-h">
        <h2><i class="fas fa-chart-column"></i>市场规模与同比</h2>
        <button class="exp-btn" data-exp="scale" title="导出规模 CSV" aria-label="导出规模 CSV"></button>
        <div class="sub" id="scaleSub">—</div>
      </div>
      <div class="chart-box"><canvas id="scaleChart"></canvas></div>
      <div class="legend"><span>柱 = 该组全国销售额（百万元，左轴）</span>
        <span><i style="background:#7209b7"></i>线 = 同比（%，右轴）</span>
        <span>同比红涨绿跌</span>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h">
      <h2><i class="fas fa-layer-group"></i>TOP10 份额结构（100% 堆叠）</h2>
      <button class="exp-btn" data-exp="share" title="导出份额 CSV" aria-label="导出份额 CSV"></button>
      <div class="sub" id="shareSub">—</div>
    </div>
    <div class="chart-box tall"><canvas id="shareChart"></canvas></div>
    <div class="legend" id="shareLegend"></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h">
      <h2><i class="fas fa-table"></i>数据明细表</h2>
      <button class="exp-btn" data-exp="table" title="导出明细 CSV" aria-label="导出明细 CSV"></button>
      <div class="sub" id="tableSub">—</div>
    </div>
    <div class="table-wrap"><table class="dt" id="dataTable"></table></div>
  </div>

  <div class="facts">
    <h2><i class="fas fa-circle-info"></i>口径与校验</h2>
    <ul id="factsList"></ul>
  </div>
  <div class="foot" id="footNote">—</div>
</div>

<script>
(function(){
'use strict';
var ZK = window.ZK;
if(!ZK || !ZK.groups){ document.querySelector('.main').innerHTML =
  '<div class="err">数据文件 zhongkang_data.js 未加载或格式异常，请检查发布包。</div>'; return; }

var PALETTE = ['#4361ee','#7209b7','#f72585','#06d6a0','#f77f00','#4cc9f0','#e5484d','#8ac926','#9b5de5','#00bbf9'];
var UP='#e5484d', DOWN='#16a34a', FLAT='#9aa3b2', OTHER='#d7dbe5';
var S = { gid: ZK.groups[0].id, period:'q', range:'12', denom:'group', metric:'sales' };
var CHARTS = {};
var EXP = { rank:[], scale:[], share:[], table:[] };
var SVG_DL = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>';

function $(id){ return document.getElementById(id); }
function fmtM(m){ return m.slice(0,2)+'/'+m.slice(2); }
function shortName(n, max){ n = String(n||''); return n.length>max ? n.slice(0,max)+'…' : n; }
function r1(v){ return (v==null||!isFinite(v)) ? null : Math.round(v*10)/10; }
function numTxt(v, d){ return (v==null||!isFinite(v)) ? '—' : Number(v).toFixed(d==null?1:d); }
function pctTxt(v, d){ return (v==null||!isFinite(v)) ? '—' : (v>0?'+':'')+Number(v).toFixed(d==null?1:d)+'%'; }
function ppTxt(v){ return (v==null||!isFinite(v)) ? '—' : (v>0?'+':'')+Number(v).toFixed(1)+'pp'; }
function cls(v){ return (v==null||!isFinite(v)||Math.abs(v)<0.0001) ? 'flat' : (v>0?'up':'down'); }
function group(){ return ZK.groups.filter(function(g){return g.id===S.gid;})[0] || ZK.groups[0]; }
function periodsAll(){ return S.period==='q' ? ZK.quarters : ZK.months; }
function labelsAll(){ return periodsAll().map(function(x){ return S.period==='q'?x:fmtM(x); }); }
function window_(){
  var all = periodsAll(), labs = labelsAll();
  var n = S.range==='all' ? all.length : Math.min(all.length, parseInt(S.range,10));
  var st = all.length - n;
  return { all:all, labs:labs, st:st, keys:all.slice(st), labels:labs.slice(st) };
}
function chgArr(o, key){
  var a = o[key] || [], out=[];
  for(var i=0;i<a.length;i++){
    var j=i-(S.period==='q'?4:12);
    out.push(j>=0 && a[i]!=null && a[j]!=null ? r1(a[i]-a[j]) : null);
  }
  return out;
}
function series(o, metric, W){
  var q = S.period==='q', a;
  if(metric==='sales')  a = q?o.sales_q:o.sales_m;
  else if(metric==='yoy') a = q?o.yoy_q:o.yoy_m;
  else if(metric==='share') a = q?o.share_q:o.share_m;
  else if(metric==='gshare') a = q?o.gshare_q:o.gshare_m;
  else if(metric==='chg') a = q?o.share_chg_pp:chgArr(o,'share_m');
  else a = [];
  a = a || [];
  return W ? a.slice(W.st) : a;
}
function valTxt(metric, v){
  if(metric==='sales') return numTxt(v,1);
  if(metric==='yoy') return pctTxt(v);
  if(metric==='share'||metric==='gshare') return (v==null||!isFinite(v))?'—':Number(v).toFixed(1)+'%';
  return ppTxt(v);
}
function metricName(m){ return ({sales:'销售额（百万元）',yoy:'同比（%）',share:'份额·占大盘（%）',
  gshare:'份额·占本组（%）',chg:'份额变化（pp）'})[m] || m; }
function denomName(){ return S.denom==='group' ? '占本组市场' : '占补气补血大盘'; }
function setHTML(id, html){ $(id).innerHTML = html; }

/* ---------- header / KPI ---------- */
function renderHead(){
  var g=ZK.groups[0], q=ZK.quarters, lastQ=q[q.length-1], lastM=ZK.months[ZK.months.length-1];
  $('hdPeriod').textContent = '数据截止 '+ZK.meta.period;
  $('hdBuild').textContent = '构建 '+ZK.meta.build.slice(5);
  $('hdMeta').textContent = '源表 '+ZK.meta.source+' ｜ 4 组细分市场 × 动态 TOP10 ｜ 月季双视图 ｜ 完整季度 '
      +q[0]+'–'+lastQ+'（'+q.length+' 季）｜ 最新月 '+fmtM(lastM)+'（26Q3 未完整，不进季度视图）';
  var mk=ZK.market, n=q.length-1, mi=ZK.months.length-1;
  var fz = g.items.filter(function(x){return x.name.indexOf('复方阿胶浆')>=0;})[0];
  var gs=group();
  var top10 = gs.items.reduce(function(s,x){return s+(x.sales_q[n]||0);},0);
  var nat = gs.national.sales_q[n]||0;
  var chgN=0, chgD=0;
  ZK.groups.forEach(function(x){ chgN+=x.new.length; chgD+=x.dropped.length; });
  var cards = [
    {t:'补气补血大盘 · '+lastQ, v:numTxt(mk.sales_q[n],1), u:'百万元',
     s:'同比 <b class="'+cls(mk.yoy_q[n])+'">'+pctTxt(mk.yoy_q[n])+'</b> ｜ 最新月 '+fmtM(lastM)+' <b>'+numTxt(mk.sales_m[mi],1)+'</b> 百万元 · 同比 <b class="'+cls(mk.yoy_m[mi])+'">'+pctTxt(mk.yoy_m[mi])+'</b>'},
    {t:'复方阿胶浆 · '+lastQ, v:numTxt(fz?fz.sales_q[n]:null,1), u:'百万元',
     s:'同比 <b class="'+cls(fz?fz.yoy_q[n]:null)+'">'+pctTxt(fz?fz.yoy_q[n]:null)+'</b> ｜ 占大盘 <b>'+numTxt(fz?fz.share_q[n]:null,1)+'%</b> ｜ 份额变化 <b class="'+cls(fz?fz.share_chg_pp[n]:null)+'">'+ppTxt(fz?fz.share_chg_pp[n]:null)+'</b>'},
    {t:gs.name.replace('-TOP10','')+' TOP10 集中度 · '+lastQ, v:numTxt(nat?top10/nat*100:null,1), u:'%',
     s:'该组前 10 品合计 <b>'+numTxt(top10,1)+'</b> / 该组全国 <b>'+numTxt(nat,1)+'</b> 百万元'},
    {t:'榜单状态 · '+ZK.meta.period, v:'10', u:'品 / 组',
     s:'按 <b>'+ZK.meta.roster_basis+'</b> 排名 ｜ 较 '+ZK.meta.prev_period+' 新进 <b>'+chgN+'</b> · 掉榜 <b>'+chgD+'</b> ｜ 4 组共 <b>40</b> 行'}
  ];
  setHTML('kpiRow', cards.map(function(c){
    return '<div class="kpi"><div class="k-t"><i class="fas fa-chart-simple"></i>'+c.t+'</div>'+
      '<div class="k-v">'+c.v+'<small>'+c.u+'</small></div><div class="k-s">'+c.s+'</div></div>';
  }).join(''));
}

/* ---------- controls ---------- */
function renderControls(){
  setHTML('groupSeg', ZK.groups.map(function(g){
    return '<button data-v="'+g.id+'" class="'+(g.id===S.gid?'on':'')+'">'+g.name.replace('-TOP10','')+'</button>';
  }).join(''));
  ['periodSeg','denomSeg'].forEach(function(id){
    Array.prototype.forEach.call($(id).querySelectorAll('button'), function(b){
      b.className = (b.dataset.v === (id==='periodSeg'?S.period:S.denom)) ? 'on' : '';
    });
  });
  $('rangeSel').value = S.range; $('metricSel').value = S.metric;
  var g=group(), W=window_();
  $('ctrlNote').textContent = '当前：'+g.name+' ｜ '+W.labels[0]+'–'+W.labels[W.labels.length-1]
    +' 共 '+W.keys.length+' 期 ｜ 份额口径 '+denomName()
    +' ｜ 榜单按 '+ZK.meta.roster_basis+' 生成，换期自动重排（非固定名单）';
  Array.prototype.forEach.call(document.querySelectorAll('.exp-btn'), function(b){
    if(!b.innerHTML) b.innerHTML = SVG_DL;
  });
}

/* ---------- charts ---------- */
function destroy(k){ if(CHARTS[k]){ CHARTS[k].destroy(); CHARTS[k]=null; } }
function baseOpts(extra){
  var o = { responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}, tooltip:{backgroundColor:'rgba(28,32,48,.94)',padding:10,
      titleFont:{size:12},bodyFont:{size:12},callbacks:{}}},
    scales:{ x:{grid:{display:false},ticks:{font:{size:11},color:'#6b7280',maxRotation:0,autoSkip:true,maxTicksLimit:14}},
             y:{grid:{color:'#eef0f5'},ticks:{font:{size:11},color:'#6b7280'}} } };
  return Object.assign(o, extra||{});
}
function renderRank(){
  var g=group(), W=window_(), li=W.all.length-1, q=S.period==='q';
  var rows = g.items.map(function(it,i){
    return { name:it.name, rank:it.rank, sales:series(it,'sales')[li],
             yoy:series(it,'yoy')[li], share:series(it,'share')[li],
             gshare:series(it,'gshare')[li], color:PALETTE[i] };
  });
  rows.sort(function(a,b){ return (b.sales||0)-(a.sales||0); });
  EXP.rank = [['排名','产品（全称）','期数','销售额(百万元)','同比(%)','份额·占大盘(%)','份额·占本组(%)']]
    .concat(rows.map(function(x){ return [x.rank,x.name,W.all[li],r1(x.sales),r1(x.yoy),r1(x.share),r1(x.gshare)]; }));
  $('rankSub').textContent = W.all[li]+' 销售额排名 · '+g.name+' · 颜色=同比方向（红涨绿跌）';
  destroy('rank');
  CHARTS.rank = new Chart($('rankChart'), {
    type:'bar',
    data:{ labels:rows.map(function(x){return '#'+x.rank+' '+shortName(x.name,13);}),
      datasets:[{ data:rows.map(function(x){return r1(x.sales);}),
        backgroundColor:rows.map(function(x){ return x.yoy==null?FLAT:(x.yoy>0?UP:DOWN); }),
        borderRadius:3, barPercentage:.78 }] },
    options:(function(){ var o=baseOpts({indexAxis:'y'});
      o.plugins.tooltip.callbacks.title=function(items){ return rows[items[0].dataIndex].name; };
      o.plugins.tooltip.callbacks.label=function(c){ var x=rows[c.dataIndex];
        return [' 销售额 '+numTxt(x.sales,1)+' 百万元',' 同比 '+pctTxt(x.yoy),
                ' 占大盘 '+numTxt(x.share,2)+'%',' 占本组 '+numTxt(x.gshare,2)+'%']; };
      o.scales.x={grid:{color:'#eef0f5'},ticks:{font:{size:11},color:'#6b7280'},title:{display:true,text:'百万元',font:{size:11}}};
      o.scales.y={grid:{display:false},ticks:{font:{size:11},color:'#414a5e'}};
      return o; })()
  });
}
function renderScale(){
  var g=group(), W=window_();
  var ns=series(g.national,'sales',W), ny=series(g.national,'yoy',W);
  EXP.scale=[['期数','该组全国销售额(百万元)','同比(%)']].concat(W.labels.map(function(l,i){
    return [W.keys[i],r1(ns[i]),r1(ny[i])]; }));
  $('scaleSub').textContent = g.name+' · '+W.labels[0]+'–'+W.labels[W.labels.length-1]+' · '+W.keys.length+' 期';
  destroy('scale');
  CHARTS.scale = new Chart($('scaleChart'), {
    type:'bar',
    data:{ labels:W.labels, datasets:[
      { type:'bar', label:'销售额', data:ns.map(r1), backgroundColor:'rgba(67,97,238,.72)',
        borderRadius:3, barPercentage:.7, yAxisID:'y', order:2 },
      { type:'line', label:'同比', data:ny.map(r1), borderColor:'#7209b7', backgroundColor:'#7209b7',
        borderWidth:2, pointRadius:2.5, pointHoverRadius:5, tension:.28, spanGaps:true,
        yAxisID:'y1', order:1 } ] },
    options:(function(){ var o=baseOpts();
      o.plugins.legend={display:true,position:'top',align:'end',labels:{boxWidth:12,font:{size:11}}};
      o.plugins.tooltip.callbacks.label=function(c){
        return c.dataset.label+'：'+(c.datasetIndex===0?numTxt(c.parsed.y,1)+' 百万元':pctTxt(c.parsed.y)); };
      o.scales.y={position:'left',grid:{color:'#eef0f5'},ticks:{font:{size:11},color:'#6b7280'},title:{display:true,text:'百万元',font:{size:11}}};
      o.scales.y1={position:'right',grid:{drawOnChartArea:false},ticks:{font:{size:11},color:'#7209b7',
        callback:function(v){return v+'%';}},title:{display:true,text:'同比',font:{size:11}}};
      return o; })()
  });
}
function shareRows(){
  var g=group(), W=window_(), key=S.denom==='group'?'gshare':'share';
  var arr=g.items.map(function(it){ return series(it,key,W); });
  var rest=W.labels.map(function(_,i){
    if(S.denom==='group') return r1(series(g.others,'gshare',W)[i]);
    var s=0, ok=true;
    arr.forEach(function(a){ if(a[i]==null) ok=false; else s+=a[i]; });
    return ok ? r1(100-s) : null;
  });
  return { arr:arr, rest:rest, restName:S.denom==='group'?'其他（本组非TOP10）':'大盘其余（非本组TOP10）' };
}
function renderShare(){
  var g=group(), W=window_(), R=shareRows();
  var ds=g.items.map(function(it,i){ return { label:shortName(it.name,11), data:R.arr[i],
    backgroundColor:PALETTE[i], borderWidth:0, stack:'s', barPercentage:.82 }; });
  ds.push({ label:R.restName, data:R.rest, backgroundColor:OTHER, borderWidth:0, stack:'s', barPercentage:.82 });
  EXP.share=[['期数','口径'].concat(g.items.map(function(x){return x.name;})).concat([R.restName])]
    .concat(W.labels.map(function(l,i){
      return [W.keys[i],denomName()].concat(g.items.map(function(_,j){return r1(R.arr[j][i]);})).concat([r1(R.rest[i])]);
    }));
  $('shareSub').textContent = g.name+' · '+denomName()+' · 每期合计 100% · '+W.keys.length+' 期';
  setHTML('shareLegend', g.items.map(function(it,i){
    return '<span><i style="background:'+PALETTE[i]+'"></i>#'+it.rank+' '+shortName(it.name,11)+'</span>';
  }).join('') + '<span><i style="background:'+OTHER+'"></i>'+R.restName+'</span>');
  destroy('share');
  CHARTS.share = new Chart($('shareChart'), {
    type:'bar', data:{labels:W.labels,datasets:ds},
    options:(function(){ var o=baseOpts();
      o.plugins.legend={display:false};
      o.plugins.tooltip.callbacks.label=function(c){ return c.dataset.label+'：'+numTxt(c.parsed.y,1)+'%'; };
      o.scales.x={stacked:true,grid:{display:false},ticks:{font:{size:11},color:'#6b7280',maxRotation:0,autoSkip:true,maxTicksLimit:14}};
      o.scales.y={stacked:true,min:0,max:100,grid:{color:'#eef0f5'},ticks:{font:{size:11},color:'#6b7280',callback:function(v){return v+'%';}}};
      return o; })()
  });
}

/* ---------- table ---------- */
function renderTable(){
  var g=group(), W=window_(), m=S.metric;
  var rows=[{o:g.national,rk:'—',name:'该组全国',sum:true}]
    .concat(g.items.map(function(it){return {o:it,rk:it.rank,name:it.name};}))
    .concat([{o:g.others,rk:'—',name:'其他（本组非TOP10）',sum:true}]);
  var head='<thead><tr><th style="min-width:230px">产品（全称）</th><th style="width:34px">#</th>'
    + W.labels.map(function(l){return '<th>'+l+'</th>';}).join('')+'</tr></thead>';
  var body=rows.map(function(r){
    var a=r.o?series(r.o,m,W):[];
    var tds=W.labels.map(function(_,i){
      var v=a[i], c=(m==='yoy'||m==='chg')?' class="'+cls(v)+'"':'';
      return '<td'+c+'>'+valTxt(m,v)+'</td>';
    }).join('');
    return '<tr'+(r.sum?' class="sum-row"':'')+'><td title="'+r.name.replace(/"/g,'&quot;')+'">'+r.name+'</td>'
      +'<td class="rk">'+r.rk+'</td>'+tds+'</tr>';
  }).join('');
  setHTML('dataTable', head+'<tbody>'+body+'</tbody>');
  $('tableSub').textContent = g.name+' · '+metricName(m)+' · '+W.labels[0]+'–'+W.labels[W.labels.length-1]
    +' · 共 '+W.keys.length+' 期 · 表头列名可悬停查看全称';
  EXP.table=[['产品','排名','指标'].concat(W.labels)].concat(rows.map(function(r){
    var a=r.o?series(r.o,m,W):[];
    return [r.name,r.rk,metricName(m)].concat(W.labels.map(function(_,i){return a[i]==null?'':r1(a[i]);}));
  }));
}

/* ---------- export ---------- */
function _csvCell(v){ v=(v==null?'':String(v)); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function _today(){ var d=new Date(); return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2); }
function downloadCSV(filename, rows){
  var csv=rows.map(function(r){return r.map(_csvCell).join(',');}).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function doExport(kind){
  var rows=EXP[kind]||[]; if(!rows.length){ alert('暂无数据可导出'); return; }
  var name={rank:'中康_TOP10榜单',scale:'中康_市场规模',share:'中康_份额结构',table:'中康_数据明细'}[kind];
  downloadCSV(name+'_'+group().name.replace('-TOP10','')+'_'+ZK.meta.period+'_'+_today()+'.csv', rows);
}

/* ---------- render all ---------- */
function renderAll(){ renderHead(); renderControls(); renderRank(); renderScale(); renderShare(); renderTable(); renderFacts(); }

$('groupSeg').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b)return; S.gid=b.dataset.v; renderAll(); });
['periodSeg','denomSeg'].forEach(function(id){
  $(id).addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b)return;
    if(id==='periodSeg'){ S.period=b.dataset.v; S.range=(S.period==='q'?'12':'24'); }
    else S.denom=b.dataset.v;
    renderAll(); });
});
$('rangeSel').addEventListener('change', function(e){ S.range=e.target.value; renderAll(); });
$('metricSel').addEventListener('change', function(e){ S.metric=e.target.value; renderTable(); });
document.addEventListener('click', function(e){
  var b=e.target.closest('.exp-btn'); if(b) doExport(b.dataset.exp);
});
renderAll();
window.__ZK_STATE = S;
})();
