<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿胶浆中心城市数据看板·趋势版 v2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            line-height: 1.6;
            padding-bottom: 40px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .sidebar {
            width: 200px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 100;
        }
        .sidebar .logo {
            padding: 0 20px 20px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 10px;
        }
        .sidebar a {
            display: block;
            padding: 10px 20px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            color: white;
            background: rgba(255,255,255,0.15);
            font-weight: 600;
        }
        .sidebar a i {
            width: 20px;
            margin-right: 8px;
        }
        .sidebar .back-link {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 10px;
        }
        .sidebar .nav-section { padding:12px 20px 6px; font-size:13px; font-weight:600; letter-spacing:1px; opacity:0.7; border-bottom:1px solid rgba(255,255,255,0.15); margin:0 16px 8px; }
        .main { flex:1; margin-left:200px; padding:28px; min-width:0; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .header h1 { font-size: 24px; color: var(--text); }
        .header .meta { font-size: 13px; color: var(--text2); }
        .header .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(67,97,238,0.1); color: var(--primary); }


        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        /* KPI 卡：视觉语言对齐 shipping-data（顶部色点 + 层级字号 + 红涨绿跌） */
        .kpi-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px 20px 16px;
            box-shadow: 0 2px 12px rgba(20,30,60,0.06);
            position: relative;
            overflow: hidden;
        }
        .kpi-card .kpi-head { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
        .kpi-card .kpi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .kpi-card .label { font-size: 12.5px; color: #8892a6; font-weight: 500; white-space: nowrap; }
        .kpi-card .value { font-size: 26px; font-weight: 700; color: #1f2330; line-height: 1.15; }
        .kpi-card .value .unit { font-size: 12px; color: #8892a6; font-weight: 400; margin-left: 3px; }
        .kpi-card .sub { font-size: 11.5px; color: #8892a6; margin-top: 7px; line-height: 1.5; }
        .kpi-card .sub b { font-weight: 600; }
        .kpi-card .sub .sep { color: #d5dae6; margin: 0 5px; }

        /* 维度复选框（胶囊式，保留原生 checkbox 语义） */
        .dim-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
        .dim-chip {
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            padding: 5px 11px 5px 9px; border: 1px solid #e2e6f0; border-radius: 20px;
            background: #fff; font-size: 12.5px; color: #5a6580; user-select: none;
            transition: all .15s; line-height: 1;
        }
        .dim-chip:hover { border-color: #c3cbe0; background: #fafbff; }
        .dim-chip input { margin: 0; cursor: pointer; accent-color: currentColor; width: 13px; height: 13px; }
        .dim-chip .swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
        .dim-chip.on { background: #f5f7ff; border-color: #c3cbe0; color: #1f2330; font-weight: 600; }
        .green .icon { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .blue .icon { background: linear-gradient(135deg, #0575e6, #021b79); }
        .orange .icon { background: linear-gradient(135deg, #f2994a, #f2c94c); }
        .red .icon { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .up { color: #e74c3c; }.down { color: #27ae60; }.flat { color: #888; }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
            min-width: 0;
        }
        .full-width { grid-column: 1 / -1; }
        .chart-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .chart-box h3 {
            font-size: 15px;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-box h3 i { color: #667eea; }
        .chart-wrap { position: relative; height: 320px; }
        .chart-wrap.tall { height: 400px; }

        .combined-block {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            margin-bottom: 24px;
            min-width: 0;
        }
        .combined-left {
            overflow: auto;
            max-height: 620px;
        }
        .combined-right {
            padding: 20px;
            border-left: 1px solid #e9ecef;
            overflow-y: auto;
            max-height: 620px;
        }
        .combined-right h3 {
            font-size: 14px;
            margin-bottom: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .combined-right h3 i { color: #667eea; }
        .trend-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .trend-card {
            padding: 14px;
            border-radius: 8px;
        }
        .trend-card h4 {
            font-size: 13px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .trend-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .trend-card h4 {
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .trend-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin: 3px 4px;
        }
        .trend-tag.vshape { background: #e8f5e9; color: #1b5e20; }
        .trend-tag.inv-v { background: #e3f2fd; color: #0d47a1; }
        .trend-tag.rise { background: #fff3e0; color: #e65100; }
        .trend-tag.fall { background: #fce4ec; color: #880e4f; }
        .trend-tag.mix-pn { background: #ffebee; color: #c62828; }
        .trend-tag.mix-np { background: #e3f2fd; color: #1565c0; }

        .table-header {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .table-header select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .table-header select:focus { border-color: #667eea; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8f9fa;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-align: right;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }
        th:first-child { text-align: left; }
        td {
            padding: 10px 14px;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
            text-align: right;
        }
        td:first-child { text-align: left; font-weight: 500; }
        tr:hover { background: #f5f7ff; }
        .total-row td { font-weight: 700; background: #f0f2ff; border-top: 2px solid #667eea; }

        .badge-up {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-up.pos { background: #ffebee; color: #e74c3c; }
        .badge-up.neg { background: #e8f5e9; color: #27ae60; }
        .badge-up.flat { background: #f5f5f5; color: #888; }
        .trend-icon {
            display: inline-block;
            width: 20px; text-align: center;
            font-size: 16px;
        }

        @media (max-width: 900px) {
            .sidebar { width: 100%; flex-direction: row; padding: 10px; align-items: center; gap: 5px; position: relative; height: auto; }
            .sidebar .logo { padding: 0 10px; border-bottom: none; margin: 0; font-size: 14px; border-right: 1px solid rgba(255,255,255,0.2); }
            .sidebar a { padding: 6px 10px; font-size: 13px; }
            .main { margin-left: 0; padding: 12px; }
            .chart-grid { grid-template-columns: 1fr; }
            .combined-block { grid-template-columns: 1fr; }
            .combined-right { border-left: none; border-top: 1px solid #e9ecef; max-height: none; }
            .combined-left { max-height: 400px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>

            <div style="overflow-x: auto;">

            <div class="trend-list" id="trendList"></div>
        </div>
    </div>
</div>

function fmt(v) { return v !== null && v !== undefined ? v.toFixed(2) : '--'; }
function pct(v) {
    if (v === null || v === undefined) return '--';
    return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
}
function badge(v) {
    if (v === null || v === undefined) return '<span class="badge-up flat">--</span>';
    if (v > 0) return '<span class="badge-up pos">' + pct(v) + '</span>';
    if (v < 0) return '<span class="badge-up neg">' + pct(v) + '</span>';
    return '<span class="badge-up flat">0.0%</span>';
}

const DIMS4 = [
    { key: 'cx',  name: '纯销',        color: '#4361ee' },
    { key: 'ka',  name: 'KA50纯销',    color: '#7209b7' },
    { key: 'ps',  name: '配送（区域）',  color: '#f72585' },
    { key: 'psq', name: '配送（省区）',  color: '#06d6a0' }
];

document.getElementById('kpiRow').innerHTML = DIMS4.map(d => {
    const cum = TOTALS[d.key + '_cum'], lcum = TOTALS[d.key + '_lcum'], yoy = TOTALS[d.key + '_yoy'];
    const cls = yoy == null ? 'flat' : (yoy >= 0 ? 'up' : 'down');
    const txt = yoy == null ? '—' : (yoy >= 0 ? '+' : '') + (yoy * 100).toFixed(1) + '%';
    return `<div class="kpi-card">
        <div class="kpi-head"><span class="kpi-dot" style="background:${d.color}"></span><span class="label">${d.name} · 1-9月</span></div>
        <div class="value">${fmt(cum)}<span class="unit">百万元</span></div>
        <div class="sub">同比 <b class="${cls}">${txt}</b><span class="sep">|</span>去年同期 ${fmt(lcum)}</div>
    </div>`;
}).join('');

// ---- 月度柱状图：复选框选择维度，每个维度一根柱（只画 2026 年）+ 同色虚线同比 ----
let monthChart = null;
function renderMonthChart() {
    const picked = [...document.querySelectorAll('#dimBar input:checked')].map(i => i.value);
    const ds = [];
    DIMS4.forEach(d => {
        if (!picked.includes(d.key)) return;
        ds.push({
            type: 'bar', label: d.name, data: TOTALS[d.key + '_m'],
            backgroundColor: d.color + 'cc', borderColor: d.color, borderWidth: 1,
            borderRadius: 3, yAxisID: 'y', barPercentage: 0.86, categoryPercentage: 0.8
        });
        ds.push({
            type: 'line', label: d.name + ' 同比', data: TOTALS[d.key + '_yoy_m'],
            borderColor: d.color, backgroundColor: d.color, borderDash: [4, 3],
            borderWidth: 1.6, tension: 0.3, pointRadius: 2.5, pointHoverRadius: 5,
            yAxisID: 'y1', spanGaps: true, fill: false
        });
    });
    if (monthChart) { monthChart.destroy(); monthChart = null; }
    monthChart = new Chart(document.getElementById('chartSalesMonth'), {
        type: 'bar',
        data: { labels: MONTHS, datasets: ds },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 12, boxHeight: 12, padding: 12, font: { size: 11 } } },
                tooltip: { callbacks: { label: function(ctx) {
                    if (ctx.dataset.yAxisID === 'y1') return ctx.dataset.label.replace(' 同比', '') + ' 同比 ' + pct(ctx.parsed.y);
                    return ctx.dataset.label + ' ' + ctx.parsed.y.toFixed(2) + ' 百万元';
                } } }
            },
            scales: {
                y: { beginAtZero: true, title: { display: true, text: '百万元' } },
                y1: { position: 'right', grid: { drawOnChartArea: false },
                      ticks: { callback: function(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(0) + '%'; } } },
                x: { grid: { display: false } }
            }
        }
    });
}
document.getElementById('dimBar').addEventListener('change', function(e) {
    const all = document.querySelectorAll('#dimBar input');
    const anyOn = [...all].some(i => i.checked);
    if (!anyOn) { e.target.checked = true; return; }   // 至少留一个，避免空图
    document.querySelectorAll('#dimBar .dim-chip').forEach(c => {
        c.classList.toggle('on', c.querySelector('input').checked);
    });
    renderMonthChart();
});
renderMonthChart();

// ---- 同比趋势分析（按上涨月数分档 · 月数跟随 MONTHS 自适应）----
const NMON = MONTHS.length;
function monthlyYoy(d, metric, i) {
    const cur = d[metric + '_m'][i], prev = d[metric + '_lm'][i];
    if (prev && prev !== 0) return cur / prev - 1;
    return null;
}

function upCount(d, metric) {
    let n = 0;
    for (let i = 0; i < NMON; i++) { const y = monthlyYoy(d, metric, i); if (y !== null && y > 0) n++; }
    return n;
}

function upBucket(n) {
    if (n >= NMON) return 'n8';
    if (n >= NMON - 2) return 'n67';
    if (n >= NMON - 4) return 'n45';
    if (n >= 2) return 'n23';
    return 'n01';
}

const trendNames = {
    n8:  { label: NMON + '个月全部上涨', cls: 'rise' },
    n67: { label: (NMON - 2) + '-' + (NMON - 1) + '个月上涨', cls: 'mix-pn' },
    n45: { label: '涨跌基本各半', cls: 'mix-np' },
    n23: { label: '2-' + (NMON - 3) + '个月上涨', cls: 'fall' },
    n01: { label: '基本全跌', cls: 'fall' }
};

function renderTrends(metric) {
    const groups = { n8: [], n67: [], n45: [], n23: [], n01: [] };
    DATA.forEach(d => { groups[upBucket(upCount(d, metric))].push(d.city); });
    document.getElementById('trendList').innerHTML =
        ['n8', 'n67', 'n45', 'n23', 'n01']
            .filter(k => groups[k].length > 0)
            .map(key => {
                const info = trendNames[key];
                const borderColor = key === 'n8' ? '#e65100' : key === 'n67' ? '#c62828' : key === 'n45' ? '#1565c0' : '#880e4f';
                return `<div class="trend-card" style="background:${borderColor}11">
                    <h4 style="color:${borderColor}">
                        ${info.label}
                        <span style="margin-left:auto;font-size:12px;font-weight:400;color:#888;">${groups[key].length}城</span>
                    </h4>
                    <div>${groups[key].map(c => `<span class="trend-tag ${info.cls}">${c}</span>`).join('')}</div>
                </div>`;
            }).join('');
}

// ---- 表格 ----
function renderTable(metric) {
    const cols = ['城市'];
    for (let i = 1; i <= 8; i++) cols.push(i + '月', '同比');
    cols.push('1-9月', '累计同比');
    document.getElementById('tableHead').innerHTML = cols.map(c => `<th>${c}</th>`).join('');

    const filtered = [...DATA].sort((a, b) => b[metric + '_cum'] - a[metric + '_cum']);

    document.getElementById('tableBody').innerHTML = filtered.map(d => {
        const cells = d[metric + '_m'].map((v, i) =>
            `<td><strong>${fmt(v)}</strong></td><td>${badge(monthlyYoy(d, metric, i))}</td>`).join('');
        return `<tr>
            <td>${d.city}</td>
            ${cells}
            <td><strong>${fmt(d[metric + '_cum'])}</strong></td><td>${badge(d[metric + '_yoy'])}</td>
        </tr>`;
    }).join('');
}

document.getElementById('metricFilter').addEventListener('change', function() {
    renderTable(this.value);
    renderTrends(this.value);
});

renderTrends('cx');
renderTable('cx');
</script>
